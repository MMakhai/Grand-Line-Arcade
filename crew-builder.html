<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10101a"><title>Grand Line Arcade — Crew Builder</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Barlow+Condensed:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#f5c85c;--paper:#f4dca8;--ink:#080d17;--red:#d52e36}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070b12 url('Assets/lobby-grand-line.png') center center/cover fixed no-repeat;color:#fff;font-family:'Barlow Condensed',sans-serif}body{overflow:hidden}.viewport{position:fixed;inset:0;width:100%;height:100%;display:flex;justify-content:center;align-items:center;overflow:hidden;background:linear-gradient(180deg,rgba(3,8,16,.22),rgba(3,8,16,.48)),url('Assets/lobby-grand-line.png') center center/cover no-repeat}.stage{position:relative;width:min(100vw,150vh);min-width:0;max-height:100vh;aspect-ratio:3/2;overflow:hidden;background:#0b111b url('Assets/Backgrounds/bounty-draft-bg.png') center/100% 100% no-repeat;isolation:isolate}.stage:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 40px #0007;z-index:15}.top-selection{position:absolute;left:37.6%;top:6.6%;width:24.9%;height:23.4%;display:block;z-index:3;overflow:hidden;background:transparent}
.draw-card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden;background:transparent}
.draw-card img{position:absolute;left:0;top:0;width:100%;height:200%;max-width:none;object-fit:cover;object-position:center top;filter:drop-shadow(0 3px 4px #000b)}
.draw-card span{position:absolute;left:4px;right:4px;bottom:4px;font-size:clamp(13px,1.25vw,21px);line-height:1.1;font-weight:900;letter-spacing:.025em;text-align:center;color:#fff1c9;-webkit-text-stroke:.35px #2b1307;text-shadow:0 2px 2px #000,0 0 5px #000,0 0 9px #000;background:linear-gradient(90deg,#080a10d9,#17100beF,#080a10d9);border-top:1px solid #e7bd61;padding:4px 2px;opacity:1;pointer-events:none}
.slot-hit.slot-hit{position:absolute;top:50.5%;height:19.2%;width:10%;padding:0;border:0;background:transparent;cursor:pointer;z-index:4;color:white}
.slot-hit:nth-child(1){left:2.5%}.slot-hit:nth-child(2){left:14.25%}.slot-hit:nth-child(3){left:26.05%}.slot-hit:nth-child(4){left:37.85%}.slot-hit:nth-child(5){left:49.7%}.slot-hit:nth-child(6){left:61.55%}.slot-hit:nth-child(7){left:74.45%}.slot-hit:nth-child(8){left:86.45%}
.slot-hit:focus-visible{outline:2px solid #fff;outline-offset:-3px}
.slot-hit .placed-portrait{position:absolute;left:1%;right:1%;top:0;height:68%;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden;isolation:isolate}
.slot-hit .placed-portrait img{position:absolute;left:0;top:0;display:block;width:100%;height:200%;max-width:none;object-fit:cover;object-position:center top;filter:drop-shadow(0 2px 3px #000a)}
.slot-hit[data-slot="paramecia"] .placed-portrait img,.slot-hit[data-slot="sensei"] .placed-portrait img{transform:translateX(3px)}
.slot-hit .placed-name{position:absolute;left:2%;right:2%;top:72%;height:25%;display:flex;align-items:center;justify-content:center;color:#261306;font-size:clamp(10px,1.05vw,16px);line-height:1.02;font-weight:900;letter-spacing:.015em;text-align:center;-webkit-text-stroke:.2px #f6dca5;text-shadow:0 1px 0 #fff5,0 1px 2px #f4dca8;overflow-wrap:anywhere;overflow:hidden;padding:0 3px}
.slot-hit.filled{cursor:default}.slot-hit.invalid{animation:shake .28s}.slot-hit:disabled{cursor:default}.how-text{display:none}
.bounty-value{position:absolute;left:63.35%;top:76.8%;width:22.25%;height:10.1%;z-index:3;display:flex;align-items:center;justify-content:center;color:#fff0c7;font-weight:900;font-size:clamp(18px,3vw,44px);letter-spacing:.02em;text-shadow:0 3px 0 #4b0809,0 0 16px #ff382c8a;text-align:center;white-space:nowrap;overflow:hidden}
.status{display:none!important;position:absolute;left:37.5%;top:28.5%;width:25%;height:2.4%;z-index:6;text-align:center;font-size:clamp(8px,.9vw,14px);font-weight:800;letter-spacing:.06em;color:#ffe7a1;text-shadow:0 2px 4px #000;pointer-events:none;overflow:hidden;white-space:nowrap}
.toast{position:absolute;left:63%;top:88.7%;width:23%;z-index:4;text-align:center;color:#ffe6a2;font-size:clamp(8px,.9vw,13px);font-weight:700;text-shadow:0 2px 4px #000;min-height:1em}
.actions{position:absolute;left:67%;top:91.1%;width:16%;height:4.2%;display:flex;justify-content:center;align-items:center;gap:2%;z-index:8}
.btn{border:1px solid #e9b64c;border-radius:3px;background:linear-gradient(#8b201d,#3b0c12);color:#fff0ca;padding:.45em 1em;font:900 clamp(9px,1.1vw,16px) 'Barlow Condensed';letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:0 2px 6px #0009}
.btn.secondary{background:linear-gradient(#1d2c3c,#0b121d);border-color:#9c8a66}.btn:disabled{opacity:.45;cursor:not-allowed}
.crew-back{display:none!important}.crew-back:hover{background:linear-gradient(145deg,#8b201d,#3b0c12)}.progress{position:absolute;right:1.8%;top:1.8%;z-index:7;color:#fff1ce;font-size:clamp(9px,1vw,15px);font-weight:800;text-shadow:0 2px 4px #000;background:#050912a6;padding:.35em .7em;border:1px solid #b28a42}.modal{position:absolute;inset:0;display:none;place-items:center;background:#000b;z-index:20;padding:5%}.modal.open{display:grid}.modalbox{max-width:520px;width:80%;padding:24px;border:2px solid #d2a14a;background:linear-gradient(145deg,#172336,#080e18);box-shadow:0 20px 80px #000;color:#f8f1e2;text-align:center}.modalbox h2{font-family:'Pirata One';font-size:clamp(24px,3vw,40px);color:#f4d48c;margin:0 0 10px}.modalbox p{font-size:clamp(14px,1.5vw,20px);line-height:1.4}.modalbox .btn{margin:4px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@keyframes slideL{0%{transform:translateX(4%);opacity:.65}100%{transform:translateX(-4%);opacity:1}}@keyframes slideC{0%{transform:scale(.97);filter:brightness(.85)}50%{transform:scale(1.02);filter:brightness(1.1)}100%{transform:scale(.97);filter:brightness(.9)}}@keyframes slideR{0%{transform:translateX(-4%);opacity:1}100%{transform:translateX(4%);opacity:.65}}@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@media(max-width:900px){.stage{width:min(100vw,150vh);min-width:0}.viewport{justify-content:center}.bounty-value{font-size:clamp(16px,2.7vw,28px)}.draw-card span{font-size:clamp(12px,1.7vw,17px)}.slot-hit .placed-name{font-size:clamp(10px,1.35vw,13px)}.how-text{display:none}.btn{font-size:clamp(9px,1.1vw,13px)}}
@media(prefers-reduced-motion:reduce){.stage.rolling .draw-card{animation:none}}
</style></head><body><div class="viewport"><main class="stage" id="stage" aria-label="Grand Line Arcade Crew Builder">
  <section class="top-selection" id="carousel" aria-label="Rastgele karakter seçimi"><div class="draw-card"></div></section>
  <div class="status" id="status" aria-live="polite">Karakter havuzundan seçim yapılıyor…</div>
  <div id="slots" aria-label="Karakter yerleştirme yuvaları"></div>
  
  <div class="bounty-value" id="bounty" aria-live="polite">0 B</div>
  <div class="toast" id="toast" aria-live="polite">Karakterin durması bekleniyor…</div>
  <div class="actions"><button class="btn secondary" id="resetBtn">Sıfırla</button></div>
  <div class="progress" id="progress">0 / 8</div>
  <div class="modal" id="modal"><div class="modalbox"><h2>Tur tamamlandı!</h2><p id="finalText"></p><button class="btn" id="playAgain">Yeni tur başlat</button><button class="btn secondary" id="closeModal">Kapat</button></div></div>
</main></div>
<script>
let CHARACTERS=[];
const SLOT_DEFS=[{id:'raceScore',title:'Irk',icon:'✥',color:'#c93440',label:'IRK'},{id:'physical',title:'Güç',icon:'✊',color:'#d87535',label:'GÜÇ'},{id:'haki',title:'Haki',icon:'◉',color:'#b53fc4',label:'HAKİ'},{id:'zoan',title:'Zoan',icon:'♟',color:'#35a75d',label:'ZOAN'},{id:'logia',title:'Logia',icon:'◉',color:'#278be8',label:'LOGIA'},{id:'paramecia',title:'Paramecia',icon:'✺',color:'#d8a72d',label:'PARAMECIA'},{id:'crew',title:'Tayfa',icon:'⚑',color:'#1e9cae',label:'TAYFA'},{id:'sensei',title:'Sensei',icon:'♜',color:'#a24bd1',label:'SENSEI'}];
const $=id=>document.getElementById(id);let manifest={},current=null,placed={},rolling=false,spinTimer=null;
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function getImage(c){let value=manifest[c.name];if(typeof value==='string')return 'Assets/Characters/'+value;if(value&&value.file)return 'Assets/Characters/'+value.file;let entry=Object.entries(manifest).find(([k])=>norm(k)===norm(c.name));if(entry){let v=entry[1];return 'Assets/Characters/'+(typeof v==='string'?v:v.file||'')}return 'Assets/Characters/'+c.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_|_$/g,'')+'.webp'}
function attachImageFallback(img,character){if(!img)return;const current=(img.getAttribute('src')||img.src||'').replace(/^https?:\/\/[^/]+\//,'');let tried=img.dataset.triedExts?img.dataset.triedExts.split('|'):[];let basePath=(img.dataset.basePath||current).replace(/\.(webp|png|jpe?g)$/i,'');if(!img.dataset.basePath)img.dataset.basePath=basePath;if(current&&!tried.includes(current))tried.push(current);const extList=['webp','png','jpg','jpeg'];const next=extList.map(ext=>basePath+'.'+ext).find(path=>!tried.includes(path));if(next){tried.push(next);img.dataset.triedExts=tried.join('|');img.src=next;return}img.dataset.triedExts=tried.join('|');img.onerror=null;img.style.opacity='.12';img.alt=(character?.name||img.alt||'Karakter')+' görseli bulunamadı'}
function val(c,id){const v=c?.[id];return typeof v==='number'&&Number.isFinite(v)?v:null}
// Tek uygunluk kuralı: ilgili puan alanı sayısal ve dolu olmalı.
function eligible(c,slot){return val(c,slot)!==null}
function pool(slot){return CHARACTERS.filter(c=>eligible(c,slot))}
function normScore(c,slot){const p=val(c,slot);if(p===null)return 0;const vals=pool(slot).map(x=>val(x,slot)).filter(x=>x!==null);if(!vals.length)return 0;const lo=Math.min(...vals),hi=Math.max(...vals);return hi===lo?100:100*(p-lo)/(hi-lo)}
function format(n){return Math.round(n).toLocaleString('tr-TR')}
function bounty(){const scores=SLOT_DEFS.filter(s=>placed[s.id]).map(s=>normScore(placed[s.id],s.id));if(!scores.length)return 0;const average=scores.reduce((a,b)=>a+b,0)/8;return 6450000000*Math.pow(average/100,3)}
function renderSlots(){const root=$('slots');root.innerHTML=SLOT_DEFS.map((s,i)=>{const c=placed[s.id];return `<button type="button" class="slot-hit ${c?'filled':''}" data-slot="${s.id}" aria-label="${s.label}: ${c?c.name:'boş yuva'}" ${c||!current||rolling?'disabled':''}><span class="sr-only">${s.label}</span><span class="placed-portrait">${c?`<img src="${getImage(c)}" alt="${c.name}" onerror="attachImageFallback(this,CHARACTERS.find(x=>x.name===this.alt))">`:''}</span><span class="placed-name">${c?c.name:''}</span></button>`}).join('');$('progress').textContent=`${Object.keys(placed).length} / 8 YUVA`;root.querySelectorAll('[data-slot]').forEach(b=>b.addEventListener('click',()=>place(b.dataset.slot)));$('bounty').textContent=format(bounty())+' B'}
function renderCarousel(list){const card=$('carousel').querySelector('.draw-card');const c=list[list.length-1];card.innerHTML=c?`<img src="${getImage(c)}" alt="${c.name}" onerror="attachImageFallback(this,CHARACTERS.find(x=>x.name===this.alt))"><span>${c.name}</span>`:''}
function stopCharacter(c){clearTimeout(spinTimer);rolling=false;current=c;$('stage').classList.remove('rolling');renderCarousel([c]);$('status').textContent='';$('toast').textContent='Karakteri uygun bir yuvaya yerleştir.';renderSlots()}
function drawCharacter(){if(Object.keys(placed).length>=8){finish();return}
 const openSlots=SLOT_DEFS.filter(slot=>!placed[slot.id]);
 const available=CHARACTERS.filter(c=>openSlots.some(slot=>eligible(c,slot.id)));
 if(!available.length){$('toast').textContent='Kalan yuvalara uygun karakter bulunamadı. Sıfırla ile yeniden başlat.';$('status').textContent='UYGUN KARAKTER BULUNAMADI';return}
 rolling=true;current=null;$('stage').classList.add('rolling');$('status').textContent='KARAKTER SEÇİLİYOR…';$('toast').textContent='Rastgele karakter belirleniyor…';renderSlots();
 const total=3+Math.floor(Math.random()*3);let n=0;
 function tick(){if(!rolling)return;const c=available[Math.floor(Math.random()*available.length)];renderCarousel([c]);n++;if(n>=total){stopCharacter(c);return}spinTimer=setTimeout(tick,110+n*75)}
 tick()}
function place(slot){if(!current||rolling||placed[slot])return;const c=current;if(!eligible(c,slot)){const b=document.querySelector(`[data-slot="${slot}"]`);b?.classList.add('invalid');$('toast').textContent=`${c.name} için ${SLOT_DEFS.find(s=>s.id===slot)?.label||slot} puanı boş; başka yuva seç.`;setTimeout(()=>b?.classList.remove('invalid'),500);return}
 placed[slot]=c;current=null;$('status').textContent='KARAKTER YERLEŞTİRİLDİ';renderSlots();
 if(Object.keys(placed).length===8){finish();return}
 $('toast').textContent='Yerleştirildi. Yeni karakter geliyor…';drawCharacter()}
function finish(){if($('modal').classList.contains('open'))return;rolling=false;clearTimeout(spinTimer);$('stage').classList.remove('rolling');const total=bounty();$('modal').classList.add('open');$('finalText').textContent=`Sekiz yuvayı tamamladın. Toplam Bounty: ${format(total)} B. Crew Builder ödülün: ${format(Math.floor(total*0.005))} B. (%0,5)`;if(window.parent!==window){const token=(globalThis.crypto?.randomUUID?.()||('cb-'+Date.now()+'-'+Math.random().toString(36).slice(2)));window.parent.postMessage({type:'crew-builder-finished',bounty:total,token},'*')}}
function reset(){clearTimeout(spinTimer);placed={};current=null;rolling=false;$('stage').classList.remove('rolling');$('modal').classList.remove('open');$('status').textContent='Yeni tur hazırlanıyor…';$('toast').textContent='Karakterin durması bekleniyor…';renderSlots();drawCharacter()}
$('resetBtn').addEventListener('click',reset);$('playAgain').addEventListener('click',reset);$('closeModal').addEventListener('click',()=>$('modal').classList.remove('open'));
$('crewBack').addEventListener('click',()=>{try{if(window.parent&&window.parent!==window&&typeof window.parent.show==='function'){window.parent.show('lobby');if(typeof window.parent.showLobbyPage==='function')window.parent.showLobbyPage('home');return}}catch(e){} if(history.length>1)history.back();else window.location.href='index.html'});
async function loadCharactersFromExcel(){
 if(!window.XLSX) throw new Error('Excel okuyucusu yüklenemedi.');
 const response=await fetch(new URL('One_Piece.xlsx',document.baseURI),{cache:'no-store'});
 if(!response.ok) throw new Error('One_Piece.xlsx yüklenemedi (HTTP '+response.status+').');
 const workbook=XLSX.read(await response.arrayBuffer(),{type:'array',cellDates:false});
 const sheet=workbook.Sheets['Karakterler'];
 if(!sheet) throw new Error('Excel içinde Karakterler sayfası bulunamadı.');
 const clean=v=>v==null?'':String(v).trim();
 const num=v=>{if(v==null||v==='')return null;if(typeof v==='number'&&Number.isFinite(v))return v;const n=Number(String(v).replace(/\s/g,'').replace(',','.'));return Number.isFinite(n)?n:null};
 const rows=XLSX.utils.sheet_to_json(sheet,{defval:null,raw:true});
 const data=[];
 for(const row of rows){
  const name=clean(row['Karakter']); if(!name) continue;
  const item={name,race:clean(row['Irk'])||'Bilinmiyor',raceScore:num(row['Race Puanı']),physical:num(row["Fiziksel Güç (Haki'siz)"]),haki:num(row['Haki']),zoan:num(row['Zoan']),logia:num(row['Logia']),paramecia:num(row['Paramecia']),crew:num(row['Tayfa (Kaptanlar)']),sensei:num(row['Sensei (Final)'])};
  // Eski dosyalarda Sensei (Final) boşsa manuel değerini kullan.
  if(item.sensei===null)item.sensei=num(row['Sensei (Manuel)']);
  data.push(item);
 }
 if(!data.length)throw new Error('Excelde karakter satırı bulunamadı.');
 CHARACTERS=data;
 console.info('Crew Builder Excel verisi yüklendi:',data.length,'karakter.');
}
async function init(){
 try{
  const r=await fetch('Assets/Characters/manifest.json',{cache:'no-store'});if(r.ok){const m=await r.json();manifest=m.characters||m}
  await loadCharactersFromExcel();
  renderSlots();drawCharacter();
 }catch(e){
  console.error('Crew Builder veri yükleme hatası:',e);
  $('status').textContent='EXCEL VERİSİ YÜKLENEMEDİ';
  $('toast').textContent='One_Piece.xlsx dosyasının crew-builder.html ile aynı klasörde olduğundan emin ol.';
 }
}init();
</script></body></html>
